

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VideoMagic AI</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#080e20;
  color:white;
}
header{
  text-align:center;
  padding:35px 15px;
}
.logo{font-size:25px;font-weight:bold;color:#a78bfa}
h1{font-size:36px;margin:25px 0 12px}
h1 span{color:#a78bfa}
.subtitle{color:#b8c1d9;line-height:1.6}
main{max-width:650px;margin:25px auto;padding:15px}
.panel{
  background:#151d33;
  border:1px solid #39435f;
  border-radius:25px;
  padding:28px 22px;
}
label{display:block;margin:20px 0 10px;font-weight:bold}
textarea,select{
  width:100%;
  padding:16px;
  border-radius:14px;
  border:1px solid #46516e;
  background:#0c1429;
  color:white;
  font-size:16px;
}
textarea{height:130px;resize:vertical}
button{
  width:100%;
  margin-top:25px;
  padding:20px;
  border:0;
  border-radius:15px;
  background:#8954ed;
  color:white;
  font-size:19px;
  font-weight:bold;
}
button:active{opacity:.8}
#message{
  display:none;
  margin-top:20px;
  padding:18px;
  border-radius:14px;
  background:#202a45;
  color:#d6c6ff;
  line-height:1.6;
}
.modes{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:25px;
}
.mode{
  background:#202a45;
  padding:22px 8px;
  border-radius:14px;
  text-align:center;
  font-size:17px;
}
footer{
  text-align:center;
  color:#929bb3;
  padding:35px 10px;
}
</style>
</head>
<body>

<header>
  <div class="logo">🎬 VideoMagic AI</div>
  <h1>Transforme tes idées<br>en <span>vidéos AI</span></h1>
  <p class="subtitle">
    Create amazing videos in seconds with AI.<br>
    Crée de belles vidéos grâce à l'intelligence artificielle.
  </p>
</header>

<main>
  <section class="panel">
    <h2>🎬 Create your video</h2>

    <label for="prompt">Describe your video / Décris ta vidéo</label>
    <textarea id="prompt" placeholder="Example: A cute baby elephant playing in a magical forest..."></textarea>

    <label for="style">Choose your video style / Choisis le style</label>
    <select id="style">
      <option>Realistic video</option>
      <option>3D Cartoon</option>
      <option>Anime</option>
      <option>Cinematic</option>
    </select>

    <label for="duration">Video duration / Durée</label>
    <select id="duration">
      <option>10 seconds</option>
      <option>15 seconds</option>
    </select>

    <button onclick="generateVideo()">✨ Generate my video</button>

    <div id="message"></div>
  </section>

  <section class="modes">
    <div class="mode">✍️ Text to Video</div>
    <div class="mode">🖼️ Image to Video</div>
    <div class="mode">🐻 3D Cartoon</div>
    <div class="mode">🎤 Talking Videos</div>
  </section>
</main>

<footer>
  © 2026 VideoMagic AI — Create without limits.
</footer>

<script>
function generateVideo(){
  const prompt=document.getElementById("prompt").value.trim();
  const style=document.getElementById("style").value;
  const duration=document.getElementById("duration").value;
  const message=document.getElementById("message");

  if(!prompt){
    message.style.display="block";
    message.innerText="⚠️ Please describe your video first. Décris d'abord ta vidéo.";
    return;
  }

  message.style.display="block";
  message.innerText=
    "✅ Your video request is ready! Ta demande est prête. " +
    "Style: "+style+". Duration: "+duration+". " +
    "The AI video engine is not connected yet. Le moteur IA sera connecté dans une prochaine étape.";
}
</script>

</body>
</html>
